<style>
:root{
  --primary:#0e7490; --primary-d:#155e75; --accent:#14b8a6; --accent-l:#ccfbf1;
  --bg:#f0fdfa; --card:#ffffff; --text:#1e293b; --muted:#64748b;
  --danger:#dc2626; --danger-l:#fee2e2; --warn:#b45309; --warn-l:#fef3c7;
  --ok:#16a34a; --ok-l:#dcfce7; --border:#e2e8f0; --radius:20px; --radius-sm:14px;
  --fs:16px; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0b1a20;--card:#15323c;--text:#e6f6f9;--muted:#93b3bd;--border:#24474f;
        --accent-l:#0e3b3a;--danger-l:#3d0f0f;--warn-l:#3d2200;--ok-l:#12331c;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--fs);min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:14px}
.screen{display:none}.screen.active{display:block}
.topbar{display:flex;align-items:center;gap:10px;background:var(--primary);border-radius:var(--radius);padding:12px 16px;color:#fff;margin-bottom:14px}
.topbar img{width:40px;height:40px;border-radius:12px;object-fit:contain;background:#fff;padding:2px}
.topbar .t{font-weight:800;font-size:20px;letter-spacing:.5px}
.topbar .s{font-size:12px;opacity:.85}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:8px;color:var(--primary)}
.btn{border:none;border-radius:999px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);background:var(--primary);color:#fff;width:100%}
.btn.ghost{background:var(--accent-l);color:var(--primary)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:8px 12px;width:auto;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:15px;background:var(--bg);color:var(--text);font-family:var(--font);outline:none}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-l);color:var(--primary);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer}
.chip.on{background:var(--primary);color:#fff}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.badge.red{background:var(--danger-l);color:var(--danger)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.muted{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:12px;gap:4px}
.tab{flex:1;text-align:center;padding:10px;border-radius:16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--font)}
.tab.on{background:var(--primary);color:#fff}
.panel{display:none}.panel.on{display:block}
.med{display:flex;gap:12px;align-items:center}
.med .ph{width:52px;height:52px;border-radius:var(--radius-sm);background:var(--accent-l);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;object-fit:cover}
.warnbox{margin-top:10px;background:var(--danger-l);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px;font-size:13px;color:var(--danger)}
.dose{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm)}
.dose.done{background:var(--ok-l)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;text-align:center}
.center img{width:96px;height:96px}
.section{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;padding:18px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.ai{background:var(--accent-l);border-radius:var(--radius-sm);padding:10px;font-size:13px;margin-top:8px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border:none}
</style>
</head>

async function sbFetch(path,method='GET',body=null,prefer='return=representation'){
  const h={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
  if(prefer)h['Prefer']=prefer;
  const opts={method,headers:h};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SB_URL+path,opts);
  if(!r.ok){throw new Error(await r.text())}
  const txt=await r.text();return txt?JSON.parse(txt):[];
}

async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){
  const u=E('acctUser').value.trim().toLowerCase().replace(/\s+/g,'_');
  const pin=E('acctPin').value.trim();
  if(!u||!/^\d{6}$/.test(pin)){E('loginStatus').textContent='Kullanıcı adı + 6 haneli şifre gerekli';return}
  E('loginStatus').textContent='Giriş yapılıyor…';
  const h=await hashPin(pin);
  try{
    const us=await sbFetch('/rest/v1/users?username=eq.'+encodeURIComponent(u)+'&select=id,username,password_hash');
    let id;
    if(us.length){
      if(us[0].password_hash&&us[0].password_hash!==h){E('loginStatus').textContent='Şifre hatalı';return}
      if(!us[0].password_hash)await sbFetch('/rest/v1/users?id=eq.'+us[0].id,'PATCH',{password_hash:h});
      id=us[0].id;
    }else{const c=await sbFetch('/rest/v1/users','POST',{username:u,password_hash:h});id=c[0].id}
    uid=id;localStorage.setItem('ez_uid',uid);
    await cloudLoad();
    E('loginStatus').textContent='';E('profilesCard').hidden=false;renderProfiles();
  }catch(e){E('loginStatus').textContent='Bağlantı hatası: '+e.message}
}
async function cloudLoad(){
  try{
    const rows=await sbFetch('/rest/v1/meds?user_id=eq.'+uid+'&select=id,profile,data');
    store.meds=rows.map(r=>({id:r.id,profile:r.profile,...r.data}));
    const ids=[...new Set(store.meds.map(m=>m.profile))];
    ids.forEach(pid=>{if(!store.profiles.some(p=>p.id===pid))store.profiles.push({id:pid,name:pid==='me'?'Ben':pid,emoji:pid==='me'?'🙂':'👤'})});
    if(!store.active||!store.profiles.some(p=>p.id===store.active))store.active=ids[0]||'me';
    store.save();
  }catch(e){E('loginStatus').textContent='Senkron uyarısı: '+e.message}
}

 {name:'NORVASC',ing:'Amlodipin',cat:'Tansiyon',purpose:'Hipertansiyon.',usage:'Yemekten bağımsız.',dosage:'Günde 1 tablet.',contra:['Ciddi düşük tansiyon'],side:'Ayak şişmesi, baş ağrısı.'},
 {name:'GLUCOPHAGE (metformin)',ing:'Metformin',cat:'Diyabet',purpose:'Kan şekerini düşürür.',usage:'Yemekle.',dosage:'Günde 2-3 kez (doktor).',contra:['Böbrek yetmezliği','Metabolik asidoz'],side:'Mide rahatsızlığı.'},
];
const RULES=[
 ['Warfarin','Asetilsalisilik asit','Warfarin ve aspirin birlikte kanama riskini ciddi artırır.'],
 ['Warfarin','Flurbiprofen','Warfarin + NSAİİ kanama riskini artırır.'],
 ['Warfarin','Naproksen sodyum','Warfarin + NSAİİ kanama riskini artırır.'],
 ['Asetilsalisilik asit','Flurbiprofen','İki NSAİİ mide kanaması riskini artırır.'],
 ['Asetilsalisilik asit','Naproksen sodyum','İki NSAİİ mide kanaması riskini artırır.'],
 ['Flurbiprofen','Naproksen sodyum','İki NSAİİ birlikte kullanılmamalı; kanama/böbrek hasarı.'],
];
function interactions(med){
  const out=[];
  for(const o of myMeds()){ if(o.id===med.id)continue;
    for(const[a,b,msg]of RULES){
      const x=[med.ing.trim().toLowerCase(),o.ing.trim().toLowerCase()].sort().join('|');
      const y=[a.toLowerCase(),b.toLowerCase()].sort().join('|');
      if(x===y)out.push({with:o.ing,msg});
    }
  }
  return out;
}

function tab(name,el){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));if(el)el.classList.add('on');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));E('p-'+name).classList.add('on');if(name==='today')renderToday();if(name==='meds')renderMeds()}

/* ---- Bugün ---- */
function renderToday(){
  const meds=myMeds().filter(m=>remaining(m)>0);const body=E('todayBody');
  if(!meds.length){body.innerHTML=`<div class="card"><h3>${t('noActive')}</h3><div class="muted" style="margin:8px 0">${t('noActiveB')}</div><button class="btn" onclick="openAdd()">${t('addMed')}</button></div>`;return}
  const plan={};let tot=0,done=0;
  meds.forEach(m=>{const ts=m.times||[];tot+=ts.length;ts.forEach(tm=>{const tk=tkKey(m.id,tm,today());if(m.doses&&m.doses[tk])done++;plan[tm]=plan[tm]||[];plan[tm].push({m,tm})})});
  body.innerHTML=`<div class="muted" style="margin-bottom:8px">${tf('progress',{d:done,t:tot})}</div>`+
   Object.keys(plan).sort().map(tm=>`<div class="card"><div style="font-size:20px;font-weight:800;color:var(--primary);margin-bottom:6px">${tm}</div>`+
    plan[tm].map(({m})=>{const tk=tkKey(m.id,tm,today());const on=m.doses&&m.doses[tk];return `<div class="dose ${on?'done':''}" onclick="toggleDose('${m.id}','${tm}')"><div class="check ${on?'done':''}">${on?'✓':''}</div><div style="flex:1"><div style="font-weight:700">${m.name}</div><div class="muted">${m.dosage||''}</div></div><div class="muted" style="color:${on?'var(--ok)':'var(--warn)'}">${on?t('taken'):t('pending')}</div></div>`}).join('')+`</div>`).join('');
}
const tkKey=(id,tm,day)=>id+'|'+tm+'|'+day;
function toggleDose(id,tm){
  const m=store.meds.find(x=>x.id===id);if(!m)return;m.doses=m.doses||{};const k=tkKey(id,tm,today());
  m.doses[k]=!m.doses[k];m.taken=Math.max(0,Math.min(m.total,(m.taken||0)+(m.doses[k]?1:-1)));store.save();syncMed(m);renderToday();renderMeds();
}

/* ---- İlaçlar ---- */
function renderMeds(){
  const meds=myMeds().filter(m=>remaining(m)>0);const body=E('medsBody');
  if(!meds.length){body.innerHTML=`<div class="card"><div class="muted">${t('noMeds')}</div></div>`;return}
  body.innerHTML=meds.map(m=>{
    const ints=interactions(m);const warn=ints.map(i=>tf('withDrug',{d:i.with.split(' ')[0]}));
    return `<div class="card" onclick="openDetail('${m.id}')">
      <div class="med">${m.photo?`<img class="ph" src="${m.photo}">`:`<div class="ph">💊</div>`}
      <div style="flex:1"><div style="font-weight:800">${m.name}</div><div class="muted">${m.dosage||''} · ${(m.times||[]).join(' / ')}</div>
      <div class="wrap" style="margin-top:6px">${m.expiry?`<span class="badge warn">${t('tet')}: ${m.expiry}</span>`:''}<span class="badge ok">${tf('left',{n:remaining(m)})}</span></div></div></div>
      ${warn.length?`<div class="warnbox">⚠️ ${warn.join(' · ')}</div>`:''}
    </div>`}).join('');
}

/* ---- Detay ---- */
function openDetail(id){
  const m=store.meds.find(x=>x.id===id);if(!m)return;const ints=interactions(m);
  openSheet(`
    ${ints.length?`<div class="warnbox" style="border-width:2px"><b>${t('interact')}</b>${ints.map(i=>`<div style="margin-top:6px"><b>${tf('withDrug',{d:i.with})}</b><br>${i.msg}</div>`).join('')}</div>`:''}
    <div class="med" style="margin:12px 0">${m.photo?`<img class="ph" style="width:72px;height:72px" src="${m.photo}">`:`<div class="ph" style="width:72px;height:72px">💊</div>`}
      <div><div style="font-size:20px;font-weight:800">${m.name}</div><div class="muted">${m.ing||''}</div></div></div>
    ${sec(t('purpose'),m.purpose)}${sec(t('doseT'),m.dosage+(m.times&&m.times.length?`<div class="muted">${m.times.join(' / ')}</div>`:''))}
    ${sec(t('usageT'),m.usage)}${sec(t('contra'),(m.contra&&m.contra.length)?m.contra.map(c=>'• '+c).join('<br>'):t('noInfo'))}
    ${sec(t('side'),m.side)}
    <div class="row" style="margin-top:14px;gap:10px">
      <button class="btn" style="flex:1" onclick="editMed('${m.id}')">${t('edit')}</button>
      <button class="btn danger" style="flex:1" onclick="delMed('${m.id}')">${t('del')}</button>
    </div>
  `);
}
const sec=(h,b)=>`<div class="card"><h3>${h}</h3><div>${b||t('noInfo')}</div></div>`;
function editMed(id){openAdd(id)}
function delMed(id){if(!confirm(t('del')+'?'))return;store.meds=store.meds.filter(m=>m.id!==id);store.save();delMedCloud(id);closeSheet();renderMeds();renderToday()}

/* ---- Ekle ---- */
let draft={times:['08:00','20:00'],photo:'',b64:'',thumb:''};
let editingId=null;
function openAdd(editId){
  draft={times:['08:00','20:00'],photo:'',b64:'',thumb:''};
  editingId=editId||null;
  if(editId){
    const m=store.meds.find(x=>x.id===editId);
    if(m){draft.times=[...(m.times||[])];draft.thumb=m.photo||''}
  }
  openSheet(`
    <h3>${t('addMed')}</h3>
    <label>${t('name')}</label><input id="fName">
    <label>${t('dosage')}</label><input id="fDose">
    <label>${t('usage')}</label><input id="fUse">
    <div class="section" style="margin-top:8px">${t('addPhoto')}</div>
    <div class="row" style="gap:8px">
      <label class="btn ghost" style="flex:1;text-align:center;position:relative">${t('camBt')}<input type="file" accept="image/*" capture="environment" class="fchoose" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
      <label class="btn ghost" style="flex:1;text-align:center;position:relative">${t('galBt')}<input type="file" accept="image/*" class="fchoose" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    </div>
    <div id="pv"></div>
    <button class="btn ghost" onclick="readPhoto()" id="btnRead" style="margin-top:8px">${t('readPhoto')}</button>
    <div id="aiRes"></div>
    <label>${t('purpose')}</label><input id="fPurpose">
    <label>${t('contra')}</label><textarea id="fContra" rows="2"></textarea>
    <label>${t('side')}</label><textarea id="fSide" rows="2"></textarea>
    <div class="section">${t('timeQ')}</div>
    <div class="wrap" id="freq"></div>
    <div class="wrap" id="times" style="margin-top:6px"></div>
    <div class="row" style="margin-top:6px"><button class="btn sm ghost" onclick="addTime()">${t('addTime')}</button></div>
    <label>${t('presc')}</label><input type="number" id="fTotal" value="60">
    <label>${t('tetL')}</label><input id="fTet" placeholder="12-2027">
    <button class="btn" style="margin-top:14px" onclick="saveMed()">${t('save')}</button>
  `);
  renderFreq();renderTimes();
  if(editId){const m=store.meds.find(x=>x.id===editId);if(m){E('fName').value=m.name||'';E('fDose').value=m.dosage||'';E('fUse').value=m.usage||'';E('fPurpose').value=m.purpose||'';E('fContra').value=(m.contra||[]).join('\n');E('fSide').value=m.side||'';E('fTotal').value=m.total||60;E('fTet').value=m.expiry||'';if(m.photo)E('pv').innerHTML='<img src="'+m.photo+'" style="width:100%;border-radius:14px;margin-top:10px">';}}
}
function renderFreq(){E('freq').innerHTML=[
  {l:tf('daily',{n:1}),ts:['08:00']},{l:tf('daily',{n:2}),ts:['08:00','20:00']},{l:tf('daily',{n:3}),ts:['08:00','14:00','20:00']},
  {l:tf('every',{n:6,d:4}),ts:['06:00','12:00','18:00','00:00']},{l:tf('every',{n:4,d:6}),ts:['04:00','08:00','12:00','16:00','20:00','00:00']}
].map(f=>`<button class="chip" onclick='draft.times=${JSON.stringify(f.ts)};renderTimes()'>${f.l}</button>`).join('')}
function renderTimes(){E('times').innerHTML=draft.times.map((tm,i)=>`<div class="row" style="gap:6px;margin-bottom:6px"><input type="time" class="ftime" data-i="${i}" value="${tm}" style="flex:1"><button class="btn sm danger" style="width:auto" onclick="removeTime(${i})">✕</button></div>`).join('');document.querySelectorAll('.ftime').forEach(inp=>{inp.onchange=()=>{draft.times[Number(inp.dataset.i)]=inp.value||'08:00'}})}
function addTime(){draft.times.push('08:00');renderTimes()}
function removeTime(i){draft.times.splice(i,1);renderTimes()}
document.addEventListener('change',function(e){
  const inp=e.target.closest('.fchoose');if(!inp||!inp.files||!inp.files[0])return;
  const f=inp.files[0];const rd=new FileReader();
  rd.onload=function(){const src=rd.result;const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height,MAX=1280;if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX}}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);draft.b64=c.toDataURL('image/jpeg',0.75).split(',')[1];
      let tw=img.width,th=img.height,T=320;if(tw>T||th>T){if(tw>th){th=Math.round(th*T/tw);tw=T}else{tw=Math.round(tw*T/th);th=T}}
      const ct=document.createElement('canvas');ct.width=tw;ct.height=th;ct.getContext('2d').drawImage(img,0,0,tw,th);draft.thumb=ct.toDataURL('image/jpeg',0.7);
      draft.photo=src;E('pv').innerHTML='<img src="'+draft.thumb+'" style="width:100%;border-radius:14px;margin-top:10px">'};
    img.src=src};
  rd.readAsDataURL(f);inp.value='';
});
async function readPhoto(){
  const key=localStorage.getItem('ez_key')||OR_KEY_DEFAULT;
  if(!key){E('aiRes').innerHTML=`<div class="ai">${t('errKey')}</div>`;return}
  if(!draft.b64){E('aiRes').innerHTML=`<div class="ai">${t('errNo')}</div>`;return}
  E('aiRes').innerHTML=`<div class="ai"><span class="spinner"></span>${t('reading')}</div>`;
  try{
    const prompt=`Şu ilaç fotoğrafını oku (prospektüs/kutu). Tüm görünür bilgiyi çıkar. SADECE şu JSON: {"name":"ilaç adı","ing":"etken madde","dosage":"doz","usage":"kullanım şekli","purpose":"ne işe yarar","contra":["kullanılmaması gereken durumlar"],"side":"yan etkiler"}. Görünmeyen alanı boş bırak, uydurma.`;
    const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:MODEL,max_tokens:900,messages:[{role:'user',content:[{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+draft.b64}},{type:'text',text:prompt}]}]})});
    if(res.status===401||res.status===403)throw new Error('BAD');
    const d=await res.json();const txt=(d.choices&&d.choices[0]&&d.choices[0].message.content)||'';
    const j=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(j.name)E('fName').value=j.name;if(j.dosage)E('fDose').value=j.dosage;if(j.usage)E('fUse').value=j.usage;
    if(j.purpose)E('fPurpose').value=j.purpose;if(j.side)E('fSide').value=j.side;if(Array.isArray(j.contra))E('fContra').value=j.contra.join('\n');
    E('aiRes').innerHTML=`<div class="ai">✅ ${j.name||''}</div>`;
  }catch(e){E('aiRes').innerHTML=`<div class="ai">${e.message==='BAD'?t('errBad'):t('errGen')}</div>`}
}
function saveMed(){
  try{
  const name=E('fName').value.trim();if(!name){alert(t('name'));return}
  const match=CATALOG.find(c=>name.toLowerCase().includes(c.name.split(' ')[0].toLowerCase()));
  const upd={name,ing:(match&&match.ing)||'',dosage:E('fDose').value||(match&&match.dosage)||'',
    usage:E('fUse').value||(match&&match.usage)||'',purpose:E('fPurpose').value||(match&&match.purpose)||'',side:E('fSide').value||(match&&match.side)||'',
    contra:(E('fContra').value||'').split('\n').filter(Boolean),expiry:E('fTet').value||'',photo:draft.thumb||'',times:[...draft.times],
    total:parseInt(E('fTotal').value)||60};
  let m;
  if(editingId){m=store.meds.find(x=>x.id===editingId);if(m)Object.assign(m,upd)}
  else{m={id:'m'+Date.now()+Math.random().toString(36).slice(2,6),profile:store.active,...upd,taken:0,doses:{},created:Date.now()};store.meds.push(m)}
  store.save();if(m)syncMed(m).catch(()=>{});editingId=null;closeSheet();renderMeds();renderToday();
  }catch(e){alert('Hata: '+e.message)}
}
